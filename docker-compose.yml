services:
  postgres:
    image: postgres:16-alpine
    container_name: djs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler} -d ${POSTGRES_DB:-scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 200m
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c maintenance_work_mem=32MB

  redis:
    image: redis:7-alpine
    container_name: djs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "48mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    mem_limit: 96m

  scheduler-service:
    image: ${GHCR_NAMESPACE:-distributed-job-scheduler}/scheduler-service:latest
    build: ./scheduler-service
    container_name: djs-scheduler-service
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scheduler}
      REDIS_HOST: redis
      DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-http://localhost:3000}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 280m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-service-1:
    image: ${GHCR_NAMESPACE:-distributed-job-scheduler}/worker-service:latest
    build: ./worker-service
    container_name: djs-worker-service-1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scheduler}
      REDIS_HOST: redis
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
    restart: unless-stopped
    mem_limit: 200m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy

  worker-service-2:
    profiles: [demo]
    image: ${GHCR_NAMESPACE:-distributed-job-scheduler}/worker-service:latest
    build: ./worker-service
    container_name: djs-worker-service-2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scheduler}
      REDIS_HOST: redis
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
    restart: unless-stopped
    mem_limit: 200m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: djs-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      - scheduler-service
    restart: unless-stopped
    mem_limit: 48m

volumes:
  postgres-data:
  redis-data:
  caddy-data:
