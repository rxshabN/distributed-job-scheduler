services:
  postgres:
    image: postgres:16-alpine
    container_name: djs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scheduler} -d ${POSTGRES_DB:-scheduler}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Deployed shape is VM.Standard.E2.1.Micro (1 GB total RAM) -- Oracle's A1.Flex (2 OCPU/12 GB)
    # never had capacity available at signup, so these limits are sized for the amd64 fallback
    # from spec §12, not simply halved from an A1-sized budget (halving 1g/384m/768m/512m/512m
    # still sums to 1.3+ GB with even a single worker -- it doesn't fit). Budget: ~800 MB across
    # all containers, leaving ~200 MB for the host OS and Docker daemon on a 1 GB box.
    # command below also trims shared_buffers/max_connections so Postgres itself fits in 200m.
    mem_limit: 200m
    command: postgres -c shared_buffers=32MB -c max_connections=15 -c maintenance_work_mem=32MB

  redis:
    image: redis:7-alpine
    container_name: djs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Heartbeats are the only thing in Redis and they all carry a TTL, so an unbounded dataset is
    # impossible by design -- but the cap is set anyway: on a single VM shared with Postgres and
    # three JVMs, an unbounded Redis is the one process that could starve the others if anything
    # ever wrote a non-expiring key. allkeys-lru rather than noeviction because losing a heartbeat
    # key degrades gracefully (the reaper treats it as a dead worker and reclaims, which is safe)
    # whereas refusing writes would silently stop every worker from heartbeating at all.
    command:
      [
        "redis-server",
        "--maxmemory",
        "48mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    # --maxmemory dropped from 256mb: heartbeat keys are a handful of small entries per worker,
    # 48mb is already generous headroom. mem_limit kept above --maxmemory so the eviction policy,
    # not the OOM killer, is what reacts first if the keyspace ever grew unexpectedly.
    mem_limit: 96m

  scheduler-service:
    # image + build together: `docker compose up` with no local image builds from source (local
    # dev, and CI's own test job never touches this), while `docker compose pull` (the production
    # deploy step in .github/workflows/ci.yml) fetches the CI-built image from ghcr.io instead of
    # rebuilding a Java project on the VM. GHCR_NAMESPACE is unset until Rishab creates the GitHub
    # repo and fills it into .env -- see .env.example.
    image: ${GHCR_NAMESPACE:-distributed-job-scheduler}/scheduler-service:latest
    build: ./scheduler-service
    container_name: djs-scheduler-service
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scheduler}
      REDIS_HOST: redis
      DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    restart: unless-stopped
    # mem_limit is what makes the Dockerfile's -XX:MaxRAMPercentage=75 meaningful: without a
    # cgroup limit each JVM sizes its heap against the *host's* total RAM, so three services would
    # each claim 75% of the whole VM and the first real load spike would OOM-kill something.
    # 280m here vs 220m for the worker because this service holds the Tomcat thread pool and JPA
    # infrastructure the worker doesn't -- both are tight on the 1 GB E2.1.Micro fallback (see
    # postgres's mem_limit comment above), no headroom to spare beyond what each actually needs.
    mem_limit: 280m
    # The image's own HEALTHCHECK hits /actuator/health, which only passes once Flyway has
    # migrated and the datasource is live -- which is exactly the condition the workers below wait
    # on, so it has to mean more than "the port is open".
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Two replicas (spec §12's deployment table) -- this is the horizontal-scaling proof point: the
  # claim query's FOR UPDATE SKIP LOCKED is what makes running N of these safe at all (spec §1,
  # §4). scheduler-service owns migrations and must be healthy (schema present) before either
  # worker starts polling.
  #
  # On the deployed 1 GB E2.1.Micro fallback (see postgres's mem_limit comment), postgres (200m) +
  # redis (96m) + scheduler-service (280m) + one worker (220m) already sum to 796m, leaving only
  # ~200m for the host OS and Docker daemon -- there is no room left for worker-service-2 to run
  # concurrently by default. It carries the "demo" profile below so plain `docker compose up -d`
  # (no --profile flag) only brings up worker-service-1; the multi-worker claim-safety behaviour
  # is still real and still covered by the concurrent-claim integration test, it's just not
  # permanently running two replicas on this box. Bring worker-service-2 up temporarily for a live
  # demo with `docker compose --profile demo up -d worker-service-2` (stop it again afterward,
  # e.g. `docker compose stop worker-service-2`) -- or drop the profiles: line entirely to run both
  # permanently if this ever moves to a box with more than 1 GB RAM.
  worker-service-1:
    image: ${GHCR_NAMESPACE:-distributed-job-scheduler}/worker-service:latest
    build: ./worker-service
    container_name: djs-worker-service-1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scheduler}
      REDIS_HOST: redis
    restart: unless-stopped
    mem_limit: 220m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler-service:
        # service_healthy, not service_started: scheduler-service owns the Flyway migrations, and
        # a worker that starts first spends its early poll cycles throwing
        # "relation \"jobs\" does not exist" against a schema that isn't there yet. Waiting on the
        # health check makes the ordering the comment above always claimed it was.
        condition: service_healthy

  worker-service-2:
    # See worker-service-1's comment above -- opt-in only on the 1 GB deployed shape.
    profiles: [demo]
    image: ${GHCR_NAMESPACE:-distributed-job-scheduler}/worker-service:latest
    build: ./worker-service
    container_name: djs-worker-service-2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scheduler}
      REDIS_HOST: redis
    restart: unless-stopped
    mem_limit: 220m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scheduler-service:
        # service_healthy, not service_started: scheduler-service owns the Flyway migrations, and
        # a worker that starts first spends its early poll cycles throwing
        # "relation \"jobs\" does not exist" against a schema that isn't there yet. Waiting on the
        # health check makes the ordering the comment above always claimed it was.
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    container_name: djs-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      - scheduler-service
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
