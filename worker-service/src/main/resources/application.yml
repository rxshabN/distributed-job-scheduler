server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: worker-service
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:scheduler}
    username: ${POSTGRES_USER:scheduler}
    password: ${POSTGRES_PASSWORD:localdev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: ecs

worker:
  batch-size: 5
  lease-seconds: 30
  poll-interval-ms: 1000
  base-backoff-delay-millis: 1000
  max-backoff-delay-millis: 300000
  heartbeat-ttl-seconds: 15
  heartbeat-refresh-interval-ms: 5000
  http-callback:
    allowed-schemes: [http, https]
    allow-private-networks: false
    allowed-ports: []
    allowed-hosts: []
