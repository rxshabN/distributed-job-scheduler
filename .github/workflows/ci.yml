name: CI

# Dashboard deploy isn't a job here -- Vercel's own GitHub integration (connect the repo, set
# root directory to dashboard/) handles that on every push, which is simpler and more reliable
# than reimplementing what Vercel already does. This workflow owns the two backend services only.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [scheduler-service, worker-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Testcontainers needs Docker, which GitHub's ubuntu-latest runners ship with already --
      # no separate service container setup needed for Postgres/Redis, unlike a typical CI matrix
      # that mocks them. This is deliberately the same real-Postgres-and-Redis suite as local dev.
      - name: mvn verify
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B verify

  build-and-push:
    name: Build and push images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [scheduler-service, worker-service]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI repository names must be all-lowercase, but github.repository_owner preserves the
      # account's display casing (rxshabN) -- buildx rejected every tag built directly from it
      # ("repository name must be lowercase") until this step lowercased it first. GHCR_NAMESPACE
      # in .env on the VM has to match this same lowercase form for `docker compose pull` to find
      # the image.
      - name: Lowercase repository owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # linux/amd64 + linux/arm64: the Oracle Always Free VM (spec §12) is Ampere A1 (arm64), the
      # GCP e2-micro fallback is amd64 -- one image tag has to work on either without rebuilding.
      # Temurin and the JVM itself are architecture-agnostic, which is what makes this possible
      # without any per-arch code changes.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to Oracle VM
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Everything past this point assumes Rishab has already done the Oracle Cloud signup, VM
      # provisioning, and SSH key setup himself (spec §12/ROADMAP.md Weekend 4 item 5 -- "you run
      # the Oracle signup and SSH key setup yourself") and added DEPLOY_HOST/DEPLOY_USER/
      # DEPLOY_SSH_KEY as repository secrets. Until those secrets exist this job fails at the SSH
      # step, which is expected -- it's not meant to run successfully before that manual setup.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd distributed-job-scheduler
            # worker-service-2 carries the "demo" profile (docker-compose.yml) and is left out of
            # the default deploy -- the box is a 1 GB E2.1.Micro (spec §12's amd64 fallback; A1
            # capacity was unavailable at signup), which only has headroom for one worker
            # alongside Postgres/Redis/scheduler-service. Bring it up manually with
            # `docker compose --profile demo up -d worker-service-2` for a live demo.
            #
            # caddy is included here even though CI never builds/pushes an image for it (it's the
            # public caddy:2-alpine image) -- `pull` refreshes that image and `up -d` is what
            # actually gets the HTTPS reverse proxy running/recreated on every deploy; without it
            # the dashboard's mixed-content workaround silently stops being deployed.
            docker compose pull scheduler-service worker-service-1 caddy
            docker compose up -d scheduler-service worker-service-1 caddy
